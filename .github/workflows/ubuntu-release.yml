name: Release Tag Workflow - Ubuntu

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Ubuntu-Release
    runs-on: ${{ matrix.os }}
    container: swift:${{ matrix.swift_version }}

    strategy:
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04"]
        swift_version: ["6.0", "6.1"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Swift dependencies
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-${{ matrix.os }}-${{ matrix.swift_version }}-service-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-${{ matrix.swift_version }}-service-

      - name: Build and package App
        run: |
          bash ./release.sh swift ${{ matrix.swift_version }}

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CLWANG_RELEASE_ACCESS }}
        with:
          files: |
            release/*.tar.gz
